{%- assign struct_key = "struct" | append: page.year -%}
{%- assign navlist = site.data[struct_key].nav | sort: "order" -%}
<header id="header"
  class="header header-box-shadow-on-scroll header-abs-top header-white-nav-links-lg header-bg-transparent header-show-hide"
  data-hs-header-options='{
            "fixMoment": 1000,
            "fixEffect": "slide"
          }'>
  <div class="header-section">
    <div id="logoAndNav" class="container">
      <nav class="js-mega-menu navbar navbar-expand-lg">
        <a class="navbar-brand navbar-brand-default" href="{{ "/" | relative_url }}" aria-label="ICACHI">
          <img src="{{ site.baseurl }}/assets/img/logo/icachi-logo-dark.svg" alt="ICACHI">
        </a>

        <a class="navbar-brand navbar-brand-on-scroll" href="{{ "/" | relative_url }}" aria-label="ICACHI">
          <img src="{{ site.baseurl }}/assets/img/logo/icachi-logo.svg" alt="ICACHI">
        </a>

        <a class="navbar-brand navbar-brand-collapsed" href="{{ "/" | relative_url }}" aria-label="ICACHI">
          <img src="{{ site.baseurl }}/assets/img/logo/icachi-logo.svg" alt="ICACHI">
        </a>

        <button type="button" class="navbar-toggler btn btn-icon btn-sm rounded-circle" aria-label="Toggle navigation"
          aria-expanded="false" aria-controls="navBar" data-toggle="collapse" data-target="#navBar">
          <span class="navbar-toggler-default">
            <svg width="14" height="14" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
              <path fill="currentColor"
                d="M17.4,6.2H0.6C0.3,6.2,0,5.9,0,5.5V4.1c0-0.4,0.3-0.7,0.6-0.7h16.9c0.3,0,0.6,0.3,0.6,0.7v1.4C18,5.9,17.7,6.2,17.4,6.2z M17.4,14.1H0.6c-0.3,0-0.6-0.3-0.6-0.7V12c0-0.4,0.3-0.7,0.6-0.7h16.9c0.3,0,0.6,0.3,0.6,0.7v1.4C18,13.7,17.7,14.1,17.4,14.1z" />
            </svg>
          </span>
          <span class="navbar-toggler-toggled">
            <svg width="14" height="14" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
              <path fill="currentColor"
                d="M11.5,9.5l5-5c0.2-0.2,0.2-0.6-0.1-0.9l-1-1c-0.3-0.3-0.7-0.3-0.9-0.1l-5,5l-5-5C4.3,2.3,3.9,2.4,3.6,2.6l-1,1 C2.4,3.9,2.3,4.3,2.5,4.5l5,5l-5,5c-0.2,0.2-0.2,0.6,0.1,0.9l1,1c0.3,0.3,0.7,0.3,0.9,0.1l5-5l5,5c0.2,0.2,0.6,0.2,0.9-0.1l1-1 c0.3-0.3,0.3-0.7,0.1-0.9L11.5,9.5z" />
            </svg>
          </span>
        </button>

        <div id="navBar" class="collapse navbar-collapse">
          <div class="navbar-body header-abs-top-inner">
            <ul class="navbar-nav text-dark">
              {%- for item in navlist %}
              <li class="navbar-nav-item">
                <a class="nav-link text-dark" href="{{ item.url | relative_url }}">{{ item.title | escape }}</a>
              </li>
              {%- endfor %}
            </ul>
          </div>
        </div>
      </nav>
    </div>
  </div>
</header>
