<!-- Hero Section -->
<div class="position-relative overflow-hidden text-center text-white ichec27-hero" style="padding: 3rem 1rem;">
  <img class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover; object-position: center center; left: 0;" src="{{ site.baseurl }}/assets/img/background/2027.jpg" alt="Shanghai skyline. Photo by Steven Wei on Unsplash: https://unsplash.com/photos/city-skyline-during-night-time-KYsbqtOp-mw">
  <div class="position-absolute top-0 start-0 w-100 h-100" style="left: 0; background: linear-gradient(rgba(18, 12, 20, .5), rgba(18, 12, 20, .35));"></div>

  <div class="container position-relative z-index-2">
    <div class="d-flex justify-content-center align-items-center flex-wrap mt-5 mb-2">
      <div class="text-white text-center">
        <h1 class="h1 mb-2 custom-font">{{ site.title27 | escape }}</h1>
        <p class="ichec27-name-zh mb-2" lang="zh-Hans">人机共协计算国际会议</p>
        <p class="mb-0">International Conference on Human-Engaged Computing</p>
      </div>
    </div>

    <hr style="border-color:rgba(255,255,255,.65)">
    <p class="ichec27-details mb-2">{{ site.dateZH27 | escape }}， {{ site.venueZH27 | escape }}</p>
    <p class="ichec27-details mb-2">{{ site.dateEN27 | escape }}, {{ site.venueEN27 | escape }}</p>
    <br>
    <br>
  </div>

  <figure class="position-absolute right-0 bottom-0 left-0 mb-n1">
    <svg preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 100.1">
      <path fill="#fff" d="M0,0c0,0,934.4,93.4,1920,0v100.1H0L0,0z" />
    </svg>
  </figure>
</div>

<div class="mb-2"></div>
